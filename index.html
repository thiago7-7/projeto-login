<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="estilos/style.css">
    <link rel="stylesheet" href="estilos/media-query.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">


    <title>Login</title>   


</head>
<body>
    <main>
        <section id="login">
           
            
            <div id="imagem"></div>
            
            <div id="formulario">
               <h1>Login</h1>

              <p>Seja bem vindo(a) novamente. Faça login para acessar sua conta e poder fazer as configurações no seu ambiente.</p>
       
            

              <form action="login.php" method="post">
                 
                   <div id="campo">
                        
                         <i class="material-symbols-outlined">person</i>
                        <input type="email" name="login" id="ilogin" placeholder="digite seu e-mail" maxlength="30" minlength="10" required autocomplete="email">
                        <label for="login">Login</label>
                   </div>

              
                 
                  
                
                   <div id="campo">
                              
                      <i class="material-symbols-outlined">vpn_key</i>

                      
                        <input type="password" name="senha" id="isenha" placeholder="digite sua senha" required minlength="8" maxlength="20" autocomplete="current-password">
                         <label for="isen">Senha</label>
                          
                        
                   </div>
             
                    <input type="submit" value="Entrar">
                 
                    <a href="esqueci.html" class="botao">Esqueci a senha <i class="material-symbols-outlined">mail</i></a>
                                   
              </form>
           
            </div>

        </section>
    </main>
    
</body>
</html>
